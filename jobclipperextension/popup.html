<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Manager Co-Pilot</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <!-- You can host an icon within the extension package -->
            <!-- <img src="icons/icon48.png" alt="logo"> -->
            <h1>Job Manager</h1>
        </div>

        <div id="loader">
            <div class="spinner"></div>
        </div>

        <div id="main-content" style="display: none;">
            <div class="status-section">
                <div id="status-icon"></div>
                <div id="status-message"></div>
            </div>
    
            <div class="stats-section">
                <div class="stat">
                    <div id="total-tracked" class="stat-value">-</div>
                    <div class="stat-label">Tracked</div>
                </div>
                <div class="stat">
                    <div id="total-applied" class="stat-value">-</div>
                    <div class="stat-label">Applied</div>
                </div>
            </div>
    
            <div id="info"></div>
            <div id="error"></div>
    
            <div class="action-section">
                <a href="http://localhost" target="_blank" id="dashboard-link" class="btn btn-primary">Open Dashboard</a>
                <button id="rescan-btn" class="btn btn-secondary" style="margin-top: 8px;">Rescan Page</button>
            </div>
        </div>
    </div>
    <script type="module" src="popup.js"></script>
</body>
</html>
